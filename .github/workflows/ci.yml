name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install Tauri system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Cargo Check
      run: cargo check --manifest-path src-tauri/Cargo.toml
    - name: Clippy
      run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings
    - name: Format Check
      run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
    - name: Frontend Lint (placeholder)
      run: echo "Add frontend linting here"

  build:
    runs-on: ubuntu-latest
    needs: check
    steps:
    - uses: actions/checkout@v4
    - name: Install Tauri system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libjavascriptcoregtk-4.1-dev libsoup-3.0-dev
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Build Tauri App (Linux)
      run: |
        cd src-tauri
        cargo build --release
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: memora-linux
        path: src-tauri/target/release/memora